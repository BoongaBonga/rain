<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="style.css"> 
    <title>Rain</title>
  </head>
  <body onload="load()" style="font-family: &quot;Courier New&quot;, Courier, monospace;">
    <span id="grid">
      aaa
    </span>
    <button onclick="viewSettings()" id="settingsButton">☰</button>
    <span id="settings">
    <br>
    squareNess: <input type="range" id="squareNess">
    <br>
    drop width: <input type="range" id="dropWidth">
    <br>
    drop speed: <input type="range" id="dropSpeed">
    <br>
    drop frequency: <input type="range" id="dropFreq">
    <br>
    drop time: <input type="range" id="dropTime">
    <br>
    gray scale: <input type="text" id="userGrayScale" placeholder="@%#*+=:. ">
    <br>
    char size: <input type="range" id="userCharSize" min="1">
    <br>
    background: <input type="color" id="userBgColor">   
    waves: <input type="color" id="userWaveColor">
    </span>

    <span id="barSpan">
      <b>
      <span id="barder">
        _
      </span>
      </b>
      <input type="text" id="searchBar" placeholder="Look up something...">
    </span>

    <span>
      <ul id="results"></ul>
    </span>

    <span id="test">_</span>
</body>
<script type="text/javascript" src="main.js"></script>
</html>
